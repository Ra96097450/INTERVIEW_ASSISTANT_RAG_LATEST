services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    ports:
      - "8000:8000"

    env_file:
      - .env

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    ports:
      - "8501:8501"

    environment:
      - API_URL=http://api:8000/ask

    depends_on:
      - api